services:
  postgres:
    # wiki 도메인의 pg_bigm(한국어 키워드 검색) 확장을 쓰기 위해 pgvector/pgvector:pg16을
    # 베이스로 빌드한 커스텀 이미지 사용 (docker/postgres-pgbigm/Dockerfile 참고).
    build: ./docker/postgres-pgbigm
    container_name: domainbridge-postgres
    environment:
      POSTGRES_DB: domainbridge
      POSTGRES_USER: domainbridge
      POSTGRES_PASSWORD: domainbridge
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: domainbridge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data: