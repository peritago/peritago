services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: domainbridge-postgres
    environment:
      POSTGRES_DB: domainbridge
      POSTGRES_USER: domainbridge
      POSTGRES_PASSWORD: domainbridge
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: domainbridge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data: