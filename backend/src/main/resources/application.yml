spring:
  config:
    # wiki 도메인(miniproject_1)에서 가져온 설정: 프로젝트 루트의 .env 파일을 읽어온다(있으면).
    # 파일이 없어도 optional이라 에러 안 남. .env는 이미 .gitignore에 있어 커밋되지 않는다.
    import: optional:file:.env[.properties]

  application:
    name: domainbridge

  datasource:
    url: jdbc:postgresql://localhost:5432/domainbridge
    username: domainbridge
    password: domainbridge
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    defer-datasource-initialization: true   # ← 추가: JPA가 테이블 만든 후에 data.sql 실행

  sql:
    init:
      mode: always                          # ← 추가: data.sql을 항상 실행

  data:
    redis:
      host: localhost
      port: 6379

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy-key-for-now}
      # wiki 도메인(miniproject_1)에서 가져온 설정: 문서 임베딩에 쓰는 모델.
      embedding:
        options:
          model: text-embedding-3-small
    # wiki 도메인(miniproject_1)에서 가져온 설정: PgVectorStore가 자동 관리하는 vector_store 테이블.
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536

jwt:
  secret: ${JWT_SECRET:temporary-local-dev-secret-key-change-this-later-1234567890}

# wiki 도메인(miniproject_1)에서 가져온 검색 튜닝값. 실데이터로 조정된 값이며 최종은 아님 —
# 자세한 배경은 wiki-db-setup.sql, WikiService/VectorStoreKeywordSearchRepository 주석 참고.
wiki:
  search:
    top-k: 3
    analogy-top-k: 5
    similarity-threshold: 0.3
    keyword-similarity-threshold: 0.03